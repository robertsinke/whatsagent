name: Bug report
description: Something is broken or behaves unexpectedly
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Before filing: read **README.md → Safety and risk**. Account bans from using Baileys are a documented product risk, not a bug in the usual sense.

        Do **not** paste WhatsApp auth material, keychain exports, full SQLite databases, or screenshots of live chats.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm run dev
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: e.g. main @ abc1234, or release tag
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux (unsupported for auth — note limitation)
        - Windows (unsupported for auth — note limitation)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact phone numbers, JIDs, and message content where possible.
      render: shell
