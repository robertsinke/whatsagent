services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.8.5
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: "${HINDSIGHT_LLM_PROVIDER:-ollama}"
      HINDSIGHT_API_LLM_BASE_URL: "${HINDSIGHT_LLM_BASE_URL:-http://host.docker.internal:11434/v1}"
      # Reflect stays on glm (good prose voice docs). Retain needs structured JSON —
      # glm-5.2:cloud returns prose through the Ollama Cloud passthrough and poisons
      # the queue with JSONDecodeError (see docs/solutions/2026-07-26-poison-observation-...).
      HINDSIGHT_API_LLM_MODEL: "${HINDSIGHT_LLM_MODEL:-glm-5.2:cloud}"
      HINDSIGHT_API_RETAIN_LLM_MODEL: "${HINDSIGHT_RETAIN_LLM_MODEL:-deepseek-v4-flash:cloud}"
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hindsight-data:/home/hindsight/.pg0

volumes:
  hindsight-data:
