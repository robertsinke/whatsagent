services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.8.5
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: "${HINDSIGHT_LLM_PROVIDER:-ollama}"
      HINDSIGHT_API_LLM_BASE_URL: "${HINDSIGHT_LLM_BASE_URL:-http://host.docker.internal:11434/v1}"
      # Defaults: locally pullable gemma3:4b. Optional cloud upgrade via .env —
      # reflect glm-5.2:cloud, retain deepseek-v4-flash:cloud (glm through the
      # cloud passthrough returns prose and poisons the queue with JSONDecodeError;
      # see docs/solutions/2026-07-26-poison-observation-...).
      HINDSIGHT_API_LLM_MODEL: "${HINDSIGHT_LLM_MODEL:-gemma3:4b}"
      HINDSIGHT_API_RETAIN_LLM_MODEL: "${HINDSIGHT_RETAIN_LLM_MODEL:-gemma3:4b}"
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hindsight-data:/home/hindsight/.pg0

volumes:
  hindsight-data:
